name: Weekly update

on:
  schedule:
    # 每週一 05:37（台北時間）= 週日 21:37 UTC
    # 刻意避開整點：GitHub 整點排程最擁擠，常延遲甚至被略過
    - cron: "37 21 * * 0"
  # 第一次上傳檔案到 main 時自動執行（之後只在還沒有資料時才抓取）
  push:
    branches: [main]
  workflow_dispatch:        # 備用：可在 Actions 分頁手動執行

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Need to fetch?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! ls data/weeks/*.json >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ ! -f data/journal_metrics.json ]; then
            # 已有文章但還沒有影響係數 → 只補抓指標
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--metrics-only" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch PubMed
        if: steps.check.outputs.run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch_pubmed.py ${{ steps.check.outputs.args }}

      - name: Commit data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Weekly update $(TZ=Asia/Taipei date +%F)"
          git push
