name: Weekly update

on:
  schedule:
    # 每週一 05:37（台北時間）= 週日 21:37 UTC
    # 刻意避開整點：GitHub 整點排程最擁擠，常延遲甚至被略過
    - cron: "37 21 * * 0"
  # 上傳檔案到 main 時自動檢查：缺資料就自動補抓，不需手動執行
  push:
    branches: [main]
  workflow_dispatch:        # 備用：可在 Actions 分頁手動執行

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: check
        run: |
          RUN=true; ARGS=""
          if [ ! -f data/backfill_done.txt ]; then
            # 第一次：自動補抓過去 2 年（104 週），已存在的週次會略過
            ARGS="--backfill 104"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ ! -f data/journal_metrics.json ]; then ARGS="--metrics-only"
            elif [ ! -f data/range/730.json ]; then ARGS="--rebuild-only"
            else RUN=false; fi
          fi
          echo "run=$RUN"   >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "→ run=$RUN args=$ARGS"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch PubMed
        if: steps.check.outputs.run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u scripts/fetch_pubmed.py ${{ steps.check.outputs.args }}

      - name: Commit data
        # 即使中途失敗也保存已抓到的部分，下次自動接續
        if: always() && steps.check.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "Data update $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase --autostash
          git push
