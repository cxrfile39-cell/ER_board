name: Weekly update

on:
  schedule:
    # 每週一 06:00（台北時間）= 週日 22:00 UTC
    - cron: "0 22 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Need to fetch?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! ls data/weeks/*.json >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch PubMed
        if: steps.check.outputs.run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/fetch_pubmed.py

      - name: Commit data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Weekly update $(TZ=Asia/Taipei date +%F)"
          git push
