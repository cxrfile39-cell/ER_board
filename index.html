<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EM Weekly｜急診醫學每週文獻</title>
<meta name="description" content="每週一自動更新：急診醫學 12 個次專科最新 Journal Article / Review / Guideline">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1218'/%3E%3Cpath d='M2 17h7l2-4 3 11 4-18 3 11h9' fill='none' stroke='%2333ff88' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#5f6b7a;--line:#e3e7ec;
  --accent:#c62828;--accent-soft:#fdecea;--chip:#eef1f5;
  --article:#1e88e5;--review:#f9a825;--meta:#8e24aa;--guideline:#d32f2f;
  --mon-bg:#0b1218;--mon-green:#33ff88;--mon-yellow:#ffd54f;--mon-cyan:#4dd0e1;--mon-red:#ff5252;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161c;--card:#1b2129;--ink:#e6e9ee;--muted:#9aa5b3;--line:#2b333d;
  --accent:#ef5350;--accent-soft:#3a1f1f;--chip:#262e38;
  --article:#64b5f6;--review:#ffd54f;--meta:#ce93d8;--guideline:#ff6b6b;
}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{position:relative;background:radial-gradient(ellipse at 20% 0%,#16303a 0%,var(--mon-bg) 60%);color:#e8f5ee;overflow:hidden}
.hdr{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:18px 20px 10px}
.brand{display:flex;align-items:center;gap:12px}
.siren{width:14px;height:14px;border-radius:50%;background:var(--mon-red);box-shadow:0 0 0 0 rgba(255,82,82,.7);animation:siren 1.2s infinite;flex:none}
@keyframes siren{0%{box-shadow:0 0 0 0 rgba(255,82,82,.75)}50%{background:#ff8a80}70%{box-shadow:0 0 0 12px rgba(255,82,82,0)}100%{box-shadow:0 0 0 0 rgba(255,82,82,0)}}
header h1{margin:0;font-size:1.4rem;letter-spacing:.01em}
header h1 .em{color:var(--mon-red);font-weight:900}
header p{margin:4px 0 0;color:#9fb8ad;font-size:.88rem}
header .credit{font-size:.78rem;color:#7d958b}
header .updated{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:6px;background:rgba(51,255,136,.08);border:1px solid rgba(51,255,136,.35);color:#cfffe3;font-size:.84rem;font-family:ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace}
header .updated b{color:var(--mon-green)}
.ecg{display:block;width:100%;height:56px;position:relative;z-index:1}
.ecg path{fill:none;stroke:var(--mon-green);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(51,255,136,.8))}
.ecg .grid{stroke:rgba(51,255,136,.08);stroke-width:1;filter:none}
.chevron{height:10px;background:repeating-linear-gradient(-45deg,#d32f2f 0 14px,#fff 14px 28px)}
.triage{display:flex;height:4px}.triage i{flex:1}
.triage i:nth-child(1){background:#d32f2f}.triage i:nth-child(2){background:#f9a825}.triage i:nth-child(3){background:#43a047}.triage i:nth-child(4){background:#1e88e5}.triage i:nth-child(5){background:#212121}
.monitor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;background:var(--mon-bg);border-radius:10px;padding:10px;border:1px solid #1f2d36}
.vital{font-family:ui-monospace,Menlo,Consolas,monospace;padding:4px 8px;border-left:3px solid currentColor}
.vital .lbl{font-size:.68rem;letter-spacing:.08em;opacity:.85}
.vital .val{font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.vital.total{color:var(--mon-green)}.vital.guideline{color:var(--mon-red)}.vital.review{color:var(--mon-yellow)}.vital.article{color:var(--mon-cyan)}.vital.meta{color:#ea80fc}
.vital .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.monitor{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.vital .val{font-size:1.3rem}}
@media (max-width:520px){header h1{font-size:1.1rem}header .updated .sep{display:none}header .updated .nx{display:block}}
.ico{font-size:1rem;width:1.3em;text-align:center;flex:none;margin-top:1px}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px}
@media (max-width:860px){.wrap{grid-template-columns:1fr;padding:12px}}
aside{align-self:start;position:sticky;top:12px}
@media (max-width:860px){aside{position:static}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-size:.95rem;border-bottom:2px solid var(--accent);padding-bottom:6px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.btns{display:flex;gap:6px;margin-bottom:8px}
.btns button,.toggle-filters{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:.85rem;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
label.opt{display:flex;align-items:flex-start;gap:8px;padding:4px 2px;font-size:.9rem;cursor:pointer;border-radius:4px}
label.opt:hover{background:var(--chip)}
label.opt input{margin-top:4px;accent-color:var(--accent)}
label.opt .n{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
label.opt small{display:block;color:var(--muted);font-size:.78rem}
select,input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:.9rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar select{width:auto}
.status{color:var(--muted);font-size:.88rem;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--article);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card.review{border-left-color:var(--review)}.card.meta{border-left-color:var(--meta)}.card.guideline{border-left-color:var(--guideline)}
.card h3{margin:6px 0 4px;font-size:1rem;line-height:1.4}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--muted);font-size:.84rem}
.meta b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.badge.review{color:#1c1c1c}.badge.meta{background:var(--meta)}
.badge.article{background:var(--article)}.badge.review{background:var(--review)}.badge.guideline{background:var(--guideline)}
@media (prefers-color-scheme:dark){.badge{color:#12161c}}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);color:var(--muted);font-size:.74rem;padding:2px 8px;border-radius:999px}
.links{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;font-size:.84rem}
.links a{color:var(--accent);text-decoration:none}
.links a:hover{text-decoration:underline}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:.84rem}
details .abs{font-size:.88rem;margin-top:6px}
details .abs p{margin:0 0 6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.more{display:block;margin:10px auto;padding:10px 20px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.more[hidden]{display:none}
.sec{margin-bottom:18px}
.sec-hd{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border:none;border-radius:10px;background:var(--mon-bg);color:#fff;cursor:pointer;font:inherit;text-align:left;border-left:6px solid var(--c)}
.sec-hd:hover{filter:brightness(1.15)}
.sec-title{font-weight:700;font-size:1rem;flex:1}
.sec-title small{display:block;font-weight:400;font-size:.78rem;opacity:.75}
.sec-n{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:1.15rem;color:var(--c);background:rgba(255,255,255,.06);padding:2px 10px;border-radius:6px;white-space:nowrap}
.sec-n small{font-size:.72rem;opacity:.8;margin-left:2px}
.sec-arrow{transition:transform .2s;opacity:.8}
.sec.open .sec-arrow{transform:rotate(180deg)}
.sec-body{margin-top:8px}
.sec-body:empty{display:none}
.sec-empty{color:var(--muted);font-size:.85rem;padding:6px 4px 0}
.sec-more{display:block;width:100%;padding:10px;border:1px dashed var(--c);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:.9rem}
.sec-more:hover{background:var(--chip)}
.sec.article{--c:var(--article)}.sec.review{--c:var(--review)}.sec.meta{--c:var(--meta)}.sec.guideline{--c:var(--guideline)}
@media (prefers-color-scheme:dark){.sec-hd{background:#0b1218}}
mark{background:#ffe082;color:inherit;padding:0 1px}
.toggle-filters{display:none;width:100%;margin-bottom:10px;padding:10px}
@media (max-width:860px){.toggle-filters{display:block}aside.collapsed .panel{display:none}}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="brand"><span class="siren" aria-hidden="true"></span>
      <h1><span class="em">EM</span> Weekly｜急診醫學每週文獻</h1></div>
    <p id="sub">🚑 每週一自動更新 · 來源：PubMed</p>
    <p class="updated">🕒 上次更新：<b id="updated">—</b><span class="sep">　｜　</span><span class="nx">⏭ 下次更新：<span id="next">—</span></span></p>
    <p class="credit">製作者：JH CHIU MD · Claude 5.5</p>
  </div>
  <svg class="ecg" id="ecg" viewBox="0 0 1200 56" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="chevron" aria-hidden="true"></div>
  <div class="triage" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</header>

<div class="wrap">
  <aside id="aside">
    <button class="toggle-filters" id="toggleFilters">篩選條件 ▾</button>

    <div class="panel">
      <h2>週次</h2>
      <select id="week"></select>
    </div>

    <div class="panel">
      <h2>文章類型</h2>
      <div class="btns">
        <button data-all="type">全選</button>
        <button data-none="type">全不選</button>
      </div>
      <div id="types"></div>
    </div>

    <div class="panel">
      <h2>次專科</h2>
      <div class="btns">
        <button data-all="cat">全選</button>
        <button data-none="cat">全不選</button>
      </div>
      <div id="cats"></div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋標題、摘要、期刊、作者…">
      <select id="sort">
        <option value="date">日期（新→舊）</option>
        <option value="journal">期刊名稱</option>
      </select>
    </div>
    <div class="monitor" aria-label="本週篇數">
      <div class="vital total"><div class="lbl">TOTAL 顯示</div><div class="val" id="vTotal">--</div></div>
      <div class="vital article"><div class="lbl">ORIGINAL 原著</div><div class="val" id="v-article">--</div></div>
      <div class="vital review"><div class="lbl">REVIEW 綜論</div><div class="val" id="v-review">--</div></div>
      <div class="vital meta"><div class="lbl">SR/META 統合</div><div class="val" id="v-meta">--</div></div>
      <div class="vital guideline"><div class="lbl">GUIDELINE 指引</div><div class="val" id="v-guideline">--</div></div>
    </div>
    <div class="status" id="status">載入中…</div>
    <div id="list"></div>
  </main>
</div>

<footer>
  資料來源：<a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed / NCBI</a>。
  分類由關鍵字自動判定，僅供文獻追蹤參考。<br>
  製作者：<b>JH CHIU MD</b> · Claude 5.5
</footer>

<script>
const TYPES = [
  {id:"article",   name:"Original Article",                  short:"Original",       zh:"原著研究"},
  {id:"review",    name:"Review",                            short:"Review",         zh:"綜論"},
  {id:"meta",      name:"Systematic Review / Meta-analysis", short:"Meta-analysis",  zh:"系統性回顧 / 統合分析"},
  {id:"guideline", name:"Consensus / Guideline",             short:"Guideline",      zh:"共識 / 指引"},
];
const PREVIEW = 3;   // 每區預設顯示篇數
const META_PT = ["Meta-Analysis","Systematic Review","Network Meta-Analysis"];
const META_TITLE = /systematic review|meta-?analy|umbrella review|pooled analysis/i;
function normType(a){
  if (a.type === "guideline") return "guideline";
  if ((a.pub_types||[]).some(p => META_PT.includes(p)) || META_TITLE.test(a.title)) return "meta";
  return a.type === "review" ? "review" : "article";
}
const ICON = {general:"🏥",critical:"🫀",pediatric:"🧸",ems:"🚑",toxicology:"☠️",ultrasound:"📡",
  disaster:"🌪️",hyperbaric:"🤿",sports:"🏃",geriatric:"👵",neurology:"🧠",trauma:"🩸",
  article:"🔬",review:"📚",meta:"📊",guideline:"📋"};
const STORE = "emweekly-filters-v2";

const $ = s => document.querySelector(s);
const state = {cats:[], weekData:null, open:new Set()};
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch(e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function buildOptions(container, items, group, counts){
  const prev = saved[group];
  container.innerHTML = items.map(it => `
    <label class="opt">
      <input type="checkbox" data-group="${group}" value="${it.id}"
        ${!prev || prev.includes(it.id) ? "checked" : ""}>
      <span class="ico">${ICON[it.id] || ""}</span>
      <span>${esc(it.name)}<small>${esc(it.zh)}</small></span>
      <span class="n" data-count="${group}:${it.id}">${counts?.[it.id] ?? ""}</span>
    </label>`).join("");
}

function checked(group){
  return [...document.querySelectorAll(`input[data-group="${group}"]:checked`)].map(i => i.value);
}

function persist(){
  try {
    localStorage.setItem(STORE, JSON.stringify({type:checked("type"), cat:checked("cat"), sort:$("#sort").value}));
  } catch(e) {}
}

function updateCounts(){
  const arts = state.weekData?.articles || [];
  const types = new Set(checked("type")), cats = new Set(checked("cat"));
  const c = {};
  for (const a of arts){
    c["type:"+a.type] = (c["type:"+a.type]||0) + (a.cats.some(x=>cats.has(x)) ? 1 : 0);
    if (types.has(a.type)) for (const k of a.cats) c["cat:"+k] = (c["cat:"+k]||0) + 1;
  }
  document.querySelectorAll("[data-count]").forEach(el => el.textContent = c[el.dataset.count] || 0);
}

function highlight(text, terms){
  let h = esc(text);
  for (const t of terms){
    if (t.length < 2) continue;
    const re = new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    h = h.replace(re, "<mark>$1</mark>");
  }
  return h;
}

function cardHTML(a, terms, catName){
  const t = TYPES.find(t => t.id === a.type);
  const au = a.authors.length > 6 ? a.authors.slice(0,6).join(", ") + ", et al." : a.authors.join(", ");
  const abs = a.abstract.length
    ? `<details><summary>摘要</summary><div class="abs">${a.abstract.map(p =>
        `<p>${p.label ? `<b>${esc(p.label)}：</b>` : ""}${highlight(p.text, terms)}</p>`).join("")}</div></details>`
    : "";
  return `<article class="card ${a.type}">
    <span class="badge ${a.type}">${t.short}</span>
    <h3><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${highlight(a.title, terms)}</a></h3>
    <div class="meta"><b>${esc(a.journal)}</b> · ${esc(a.date)}${au ? " · " + esc(au) : ""}</div>
    <div class="chips">${a.cats.map(c => `<span class="chip">${ICON[c] || ""} ${esc(catName[c] || c)}</span>`).join("")}</div>
    <div class="links">
      <a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed</a>
      ${a.doi ? `<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">全文 (DOI)</a>` : ""}
      ${a.pmc ? `<a href="https://pmc.ncbi.nlm.nih.gov/articles/${esc(a.pmc)}/" target="_blank" rel="noopener">PMC 免費全文</a>` : ""}
    </div>
    ${abs}
  </article>`;
}

function render(){
  persist(); updateCounts();
  const list = $("#list"), status = $("#status");
  const arts = state.weekData?.articles || [];
  const types = new Set(checked("type")), cats = new Set(checked("cat"));
  const terms = $("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const catName = Object.fromEntries(state.cats.map(c => [c.id, c.name]));

  let rows = arts.filter(a => types.has(a.type) && a.cats.some(c => cats.has(c)));
  if (terms.length){
    rows = rows.filter(a => {
      const hay = [a.title, a.journal, a.journal_full, a.authors.join(" "),
                   a.abstract.map(p => p.text).join(" ")].join(" ").toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  const sort = $("#sort").value;
  rows.sort((x,y) => sort === "journal"
    ? x.journal.localeCompare(y.journal) || y.date.localeCompare(x.date)
    : y.date.localeCompare(x.date));

  const groups = Object.fromEntries(TYPES.map(t => [t.id, []]));
  rows.forEach(a => groups[a.type].push(a));
  $("#vTotal").textContent = rows.length;
  TYPES.forEach(t => $("#v-" + t.id).textContent = types.has(t.id) ? groups[t.id].length : "–");

  const w = state.weekData;
  status.textContent = w ? `${w.range[0]} ～ ${w.range[1]} 收錄 · 顯示 ${rows.length} / ${arts.length} 篇` : "";

  if (!cats.size || !types.size){
    list.innerHTML = `<div class="empty">${!cats.size ? "請至少選擇一個次專科" : "請至少選擇一種文章類型"}</div>`;
    return;
  }

  list.innerHTML = TYPES.filter(t => types.has(t.id)).map(t => {
    const g = groups[t.id], n = g.length, open = state.open.has(t.id);
    const shown = open ? g : g.slice(0, PREVIEW);
    const more = n > PREVIEW
      ? `<button class="sec-more" data-sec="${t.id}">${open ? "收合 ▴" : `顯示全部 ${n} 篇（還有 ${n - PREVIEW} 篇）▾`}</button>`
      : "";
    return `<section class="sec ${t.id}${open ? " open" : ""}" id="sec-${t.id}">
      <button class="sec-hd" data-sec="${t.id}" aria-expanded="${open}">
        <span class="ico">${ICON[t.id]}</span>
        <span class="sec-title">${t.name}<small>${t.zh}</small></span>
        <span class="sec-n">${n}<small>篇</small></span>
        ${n > PREVIEW ? `<span class="sec-arrow">▾</span>` : ""}
      </button>
      <div class="sec-body">${shown.map(a => cardHTML(a, terms, catName)).join("")}</div>
      ${n ? more : `<div class="sec-empty">本週無符合條件的文章</div>`}
    </section>`;
  }).join("");
}

async function loadWeek(week){
  $("#status").textContent = "載入中…";
  try {
    const r = await fetch(`data/weeks/${week}.json`, {cache:"no-cache"});
    state.weekData = await r.json();
    state.weekData.articles.forEach(a => a.type = normType(a));
    state.open.clear();
  } catch(e){
    state.weekData = null;
    $("#list").innerHTML = `<div class="empty">無法載入 ${esc(week)} 的資料</div>`;
    return;
  }
  render();
}

// 以台北時間 (UTC+8) 顯示
const WD = ["日","一","二","三","四","五","六"];
function fmtTaipei(d){
  const t = new Date(d.getTime() + 8*3600e3);
  const p = n => String(n).padStart(2,"0");
  return `${t.getUTCFullYear()}-${p(t.getUTCMonth()+1)}-${p(t.getUTCDate())}（${WD[t.getUTCDay()]}）${p(t.getUTCHours())}:${p(t.getUTCMinutes())}`;
}
function showUpdateTimes(updated){
  const last = updated ? new Date(updated) : null;
  $("#updated").textContent = last && !isNaN(last) ? fmtTaipei(last) + " 台北時間" : "尚未更新";
  // 下一個週一 06:00 台北時間 = 週日 22:00 UTC
  const now = new Date(), n = new Date(now);
  n.setUTCHours(22,0,0,0);
  n.setUTCDate(n.getUTCDate() + ((7 - n.getUTCDay()) % 7));
  if (n <= now) n.setUTCDate(n.getUTCDate() + 7);
  $("#next").textContent = fmtTaipei(n);
}

function drawECG(){
  const svg = $("#ecg"), W = 1200, base = 32;
  const beat = x => `L${x} ${base} L${x+12} ${base-5} L${x+22} ${base} L${x+34} ${base} L${x+38} ${base+5} L${x+45} 4 L${x+52} ${base+18} L${x+57} ${base} L${x+75} ${base} L${x+92} ${base-8} L${x+110} ${base}`;
  let d = `M0 ${base}`;
  for (let x = 30; x < W; x += 170) d += " " + beat(x);
  d += ` L${W} ${base}`;
  let grid = "";
  for (let x = 0; x <= W; x += 40) grid += `<line class="grid" x1="${x}" y1="0" x2="${x}" y2="56"/>`;
  svg.innerHTML = `<g>${grid}</g><path d="${d}"/>`;
  svg.querySelectorAll("line").forEach(l => l.setAttribute("stroke","rgba(51,255,136,.08)"));
  const path = svg.querySelector("path"), len = path.getTotalLength();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  path.style.strokeDasharray = `${len*0.35} ${len*0.65}`;
  path.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 6000, iterations: Infinity});
}

async function init(){
  drawECG();
  let index;
  try {
    const r = await fetch("data/index.json", {cache:"no-cache"});
    index = await r.json();
  } catch(e){ index = null; }

  state.cats = index?.categories || [];
  buildOptions($("#types"), TYPES, "type");
  buildOptions($("#cats"), state.cats, "cat");
  if (saved.sort) $("#sort").value = saved.sort;
  showUpdateTimes(index?.updated);

  if (!index || !index.weeks?.length){
    $("#status").textContent = "";
    $("#list").innerHTML = `<div class="empty">尚無資料。<br>首次抓取約需 3–5 分鐘，請稍後重新整理。<br>若超過 10 分鐘仍無資料，請確認 repo 內有 <code>.github/workflows/weekly.yml</code>，並查看 Actions 分頁是否有錯誤。</div>`;
    return;
  }
  $("#week").innerHTML = index.weeks.map(w =>
    `<option value="${esc(w.week)}">${esc(w.week)} 週（${w.count} 篇）</option>`).join("");
  const fromHash = decodeURIComponent(location.hash.slice(1));
  if (index.weeks.some(w => w.week === fromHash)) $("#week").value = fromHash;
  await loadWeek($("#week").value);
}


// 事件
document.addEventListener("change", e => {
  if (e.target.matches("input[data-group]")) render();
});
document.querySelectorAll("[data-all],[data-none]").forEach(b => b.addEventListener("click", () => {
  const g = b.dataset.all || b.dataset.none, on = !!b.dataset.all;
  document.querySelectorAll(`input[data-group="${g}"]`).forEach(i => i.checked = on);
  render();
}));
$("#week").addEventListener("change", e => { location.hash = e.target.value; loadWeek(e.target.value); });
$("#sort").addEventListener("change", () => render());
let qTimer; $("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(render, 200); });
$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-sec]"); if (!b) return;
  const id = b.dataset.sec;
  const wasOpen = state.open.has(id);
  if (!wasOpen && !b.parentElement.querySelector(".sec-more")) return; // 篇數 ≤ 預覽數，不需展開
  wasOpen ? state.open.delete(id) : state.open.add(id);
  render();
  if (wasOpen) document.getElementById("sec-" + id).scrollIntoView({behavior:"smooth", block:"start"});
});
$("#toggleFilters").addEventListener("click", () => {
  const a = $("#aside"); a.classList.toggle("collapsed");
  $("#toggleFilters").textContent = a.classList.contains("collapsed") ? "篩選條件 ▸" : "篩選條件 ▾";
});
if (matchMedia("(max-width:860px)").matches){ $("#aside").classList.add("collapsed"); $("#toggleFilters").textContent = "篩選條件 ▸"; }

init();
</script>
